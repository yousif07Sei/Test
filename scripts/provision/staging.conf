# Provisioning values for staging. Placeholders: change them to your own box.
# No secrets here: those live in the box's .env, which provisioning never writes.

# provision.sh refuses to run on any other machine, so `production` typed on
# this box cannot write the other box's config.
EXPECTED_HOSTNAME=app-staging

ENV_LABEL=Staging
APP_DIR=/var/www/app
WEB_USER=www-data
RUNNER_USER=runner

SITE_NAME=app
DOMAIN=staging.example.com
# Optional extra names, e.g. the box's LAN address. Empty removes the line.
SERVER_ALIAS_DIRECTIVE=
LOG_NAME=app-staging
# HSTS only on production: browsers must not pin HTTPS for a throwaway host.
HSTS_DIRECTIVE=
